name: Daily Scraper Pipeline

on:
  schedule:
    # 01:30 UTC = 07:00 IST — matches wrangler cron
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python scrapers
        working-directory: insight-sender-bot
        run: |
          pip install -r requirements.txt
          if [ -d scrapers/keep-up-daily ]; then
            pip install -r scrapers/keep-up-daily/requirements.txt
          fi

      - name: Run scraper pipeline
        working-directory: insight-sender-bot
        run: node scripts/run-scrapers.mjs

      - name: Upload scraper HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: scraper-report
          path: insight-sender-bot/output/*.html
          retention-days: 30

      - name: Trigger daily brief (Cloudflare Worker)
        if: ${{ secrets.RUN_DAILY_WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.RUN_DAILY_WEBHOOK_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json"
